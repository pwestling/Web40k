# Open Battle, self-hosted: `cp .env.example .env`, edit it, then
# `docker compose up -d`. See docs/self-host.md.
services:
  # The app and the health page over HTTPS, routing /relay to the relay.
  app:
    build: { context: ., target: app }
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:?Set DOMAIN in .env}}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [relay, mailbox, seeder, host]

  # Where browsers find each other, and where they get TURN logins.
  relay:
    build: { context: ., target: relay }
    restart: unless-stopped
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      TURN_URLS: ${TURN_URLS:-turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp}
      TURN_CHECK: host.docker.internal:3478
      MAILBOX_URL: "on"
      SEEDER_URL: ${SEEDER_URL:-on}
      OPEN_TABLES: ${OPEN_TABLES:-off}
      HOST_URL: ${HOST_URL:-on}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Play by mail: players post their turns here and the other side's app picks
  # them up. Web push is optional: set the VAPID keys in .env to turn it on.
  mailbox:
    build: { context: ., target: mailbox }
    restart: unless-stopped
    environment:
      TTL_DAYS: ${MAILBOX_TTL_DAYS:-60}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@${DOMAIN}}
    volumes:
      - mailbox_data:/data

  # Seed node: keeps the figure packs, tables, armies and replays players share
  # and serves them to whoever opens the link later. Set SEED_CONTACT for
  # takedown notices and SEED_ADMIN_TOKEN to drop files; SEEDER_URL=off hides it.
  seeder:
    build: { context: ., target: seeder }
    restart: unless-stopped
    environment:
      MAX_FILE_MB: ${SEED_MAX_FILE_MB:-96}
      MAX_TOTAL_GB: ${SEED_MAX_TOTAL_GB:-20}
      TTL_DAYS: ${SEED_TTL_DAYS:-30}
      CONTACT: ${SEED_CONTACT:-}
      ADMIN_TOKEN: ${SEED_ADMIN_TOKEN:-}
    volumes:
      - seed_data:/data

  # Host server: hosts games itself, so no player's browser has to. It meets
  # players on the relay and reaches them through TURN like any player would.
  # HOST_URL=off hides it from the app.
  host:
    build: { context: ., target: host }
    restart: unless-stopped
    environment:
      SIGNAL_URL: ws://relay:8787
      TURN_URLS: turn:host.docker.internal:3478?transport=udp,turn:host.docker.internal:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET}
      MAX_ROOMS: ${HOST_MAX_ROOMS:-50}
      IDLE_HOURS: ${HOST_IDLE_HOURS:-6}
      KEEP_DAYS: ${HOST_KEEP_DAYS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - host_data:/data
    depends_on: [relay]

  # TURN: relays game traffic for players whose networks block a direct link.
  # Host networking, so it sees real addresses and its relay ports need no mapping.
  turn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "/coturn.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      TURN_SECRET: ${TURN_SECRET}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_ALLOW_PRIVATE: ${TURN_ALLOW_PRIVATE:-}
      TURN_EXTRA_ARGS: ${TURN_EXTRA_ARGS:-}
    volumes:
      - ./deploy/coturn.sh:/coturn.sh:ro

volumes:
  caddy_data:
  caddy_config:
  mailbox_data:
  seed_data:
  host_data:
