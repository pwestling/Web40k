# Publishes a GitHub release whose notes are that version's section of
# CHANGELOG.md: on pushing a tag like v0.1.0, or run by hand ("Run workflow")
# with a version, which tags the commit it runs on.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in CHANGELOG.md (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from the changelog
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="${INPUT_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          awk -v v="$version" '
            /^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version"; exit 1; fi
          if [ "$(jq -r .version package.json)" != "$version" ]; then echo "package.json is not at $version"; exit 1; fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag that doesn't exist yet is made on this commit.
        run: gh release create "$TAG" --title "Open Battle $TAG" --notes-file notes.md --target "$GITHUB_SHA"
