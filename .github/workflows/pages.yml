name: Deploy

# Publishes the built site to the gh-pages branch. To serve it, set
# Settings → Pages → Source to "Deploy from a branch", branch gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # The TURN login service (docs/cloudflare-turn.md): a repository variable; unset, the site is STUN only.
          VITE_TURN_CONFIG: ${{ vars.TURN_CONFIG_URL }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
